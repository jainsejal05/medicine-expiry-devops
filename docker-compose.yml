services:

  # ===== MySQL Database Container =====
  mysql:
    image: mysql:8.0
    container_name: medicine_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: medicine_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - medicine_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Flask Backend Container =====
  backend:
    build: ./backend
    container_name: medicine_backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql          # service name above - Docker's internal DNS resolves this
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: medicine_db
      DB_PORT: 3306
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - medicine_network

  # ===== Frontend Container (nginx serving static files) =====
  # Serves the frontend on the SAME host as the backend (port 80), so browsers treat
  # login cookies as same-site (only host matters for SameSite, not port) - fixes
  # cross-site cookie blocking that happens when frontend and backend are on different hosts.
  frontend:
    image: nginx:alpine
    container_name: medicine_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    networks:
      - medicine_network

  # =====================================================================
  # ===== MONITORING STACK (Unit 4: Monitoring / Observability / SRE) =====
  # =====================================================================

  # Prometheus: scrapes /metrics from backend, node-exporter and cAdvisor every 15s
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: medicine_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - medicine_network

  # Alertmanager: receives alerts from Prometheus, groups them and routes them
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: medicine_alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - medicine_network

  # Grafana: dashboards. Datasource + dashboard are auto-loaded from ./monitoring/grafana
  grafana:
    image: grafana/grafana:11.2.0
    container_name: medicine_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - medicine_network

  # node-exporter: server-level metrics (CPU, RAM, disk) -> "saturation" signal
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: medicine_node_exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - medicine_network

  # cAdvisor: per-container CPU / memory metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: medicine_cadvisor
    restart: unless-stopped
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - medicine_network

networks:
  medicine_network:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data: