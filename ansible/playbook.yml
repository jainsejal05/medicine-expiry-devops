---
- name: Deploy Medicine Expiry Tracker to EC2
  hosts: medicine_server
  become: true  # run tasks with sudo

  tasks:

    # ===== Step 1: Update package lists =====
    - name: Update apt package cache
      apt:
        update_cache: yes

    # ===== Step 2: Install prerequisites for Docker =====
    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg
        state: present

    # ===== Step 3: Add Docker's official GPG key =====
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    # ===== Step 4: Add Docker repository =====
    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    # ===== Step 5: Install Docker =====
    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    # ===== Step 6: Start and enable Docker service =====
    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    # ===== Step 7: Add ubuntu user to docker group (so sudo isn't needed for docker commands) =====
    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # ===== Step 8: Create project directory on the server =====
    - name: Create project directory
      file:
        path: /home/ubuntu/medicine-expiry-devops
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    # ===== Step 9: Copy backend folder to server (excluding venv/__pycache__ - Docker builds its own environment) =====
    - name: Copy backend folder (excluding venv)
      synchronize:
        src: ../backend/
        dest: /home/ubuntu/medicine-expiry-devops/backend/
        rsync_opts:
          - "--exclude=venv"
          - "--exclude=__pycache__"
          - "--exclude=.env"

    # ===== Step 10: Copy database folder to server =====
    - name: Copy database folder
      copy:
        src: ../database/
        dest: /home/ubuntu/medicine-expiry-devops/database/
        owner: ubuntu
        group: ubuntu

    # ===== Step 10b: Copy frontend folder to server (served via nginx container) =====
    - name: Copy frontend folder
      copy:
        src: ../frontend/
        dest: /home/ubuntu/medicine-expiry-devops/frontend/
        owner: ubuntu
        group: ubuntu

    # ===== Step 11: Copy docker-compose.yml to server =====
    - name: Copy docker-compose.yml
      copy:
        src: ../docker-compose.yml
        dest: /home/ubuntu/medicine-expiry-devops/docker-compose.yml
        owner: ubuntu
        group: ubuntu

    # ===== Step 12: Copy root .env to server (for docker-compose DB password) =====
    - name: Copy root .env file
      copy:
        src: ../.env
        dest: /home/ubuntu/medicine-expiry-devops/.env
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    # ===== Step 13: Build and start containers using Docker Compose =====
    - name: Start application with Docker Compose
      command: docker compose up -d --build
      args:
        chdir: /home/ubuntu/medicine-expiry-devops

    # ===== Step 14: Wait for backend to be ready (checked FROM the EC2 server itself) =====
    - name: Wait for backend to be ready
      wait_for:
        host: "127.0.0.1"
        port: 5000
        delay: 10
        timeout: 60
