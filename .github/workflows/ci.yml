name: CI - Build Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t medicine-expiry-backend ./backend

      - name: Confirm image built successfully
        run: docker images | grep medicine-expiry-backend