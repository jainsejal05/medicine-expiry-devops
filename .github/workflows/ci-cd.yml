name: CI - Build and Test

# GitHub Actions now handles CI only (build + test + security scan).
# Deployment is done by Jenkins + Ansible (see Jenkinsfile and ansible/deploy.yml).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: ./backend
        run: python -m pytest test_app.py -v

      - name: Security scan (dependency vulnerabilities)
        working-directory: ./backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

      - name: Build backend Docker image
        run: docker build -t medicine-expiry-backend ./backend

      - name: Confirm image built successfully
        run: docker images | grep medicine-expiry-backend
