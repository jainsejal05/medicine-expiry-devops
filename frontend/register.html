<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account - Medicine Expiry Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">💊</div>
            <h1>Create Account</h1>
            <p class="subtitle">Register as a Pharmacist. Your request will be reviewed by the Admin before you can log in.</p>

            <div id="banner" class="banner banner-error"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" autofocus>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <select id="city" required>
                        <option value="">Select your city</option>
                        <option value="Pune">Pune</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Nashik">Nashik</option>
                        <option value="Nagpur">Nagpur</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password (min. 4 characters)</label>
                    <input type="password" id="password" required minlength="4">
                </div>
                <button type="submit" class="auth-submit">Submit Registration</button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
