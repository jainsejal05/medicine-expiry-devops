<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report - Medicine Expiry Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <nav>
        <h1>💊 Medicine Expiry Tracker</h1>
        <div class="nav-links">
            <button id="backBtn" class="back-btn">← Back</button>
            <div class="nav-user">
                <span class="nav-username">👤 <strong id="navUsername">...</strong></span>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Inventory Report</h2>
            <button class="btn" id="downloadPdfBtn">⬇ Download as PDF</button>
        </div>

        <div id="banner" class="banner banner-error"></div>

        <div id="reportContent">
            <div class="stats-grid" id="reportStats"></div>

            <div class="chart-grid">
                <div class="chart-box">
                    <h3>Status Distribution</h3>
                    <canvas id="statusPieChart" height="220"></canvas>
                </div>
                <div class="chart-box">
                    <h3>Category Distribution</h3>
                    <canvas id="categoryPieChart" height="220"></canvas>
                </div>
            </div>

            <div class="chart-box">
                <h3>Medicine Count by Category</h3>
                <canvas id="categoryBarChart" height="100"></canvas>
            </div>

            <div class="chart-grid">
                <div class="chart-box">
                    <h3>Expired Medicines — by Category</h3>
                    <canvas id="expiredPieChart" height="220"></canvas>
                </div>
                <div class="chart-box">
                    <h3>Expired Medicines — Details</h3>
                    <div class="table-wrapper" id="expiredTableWrap" style="box-shadow:none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script src="report.js"></script>
</body>
</html>
