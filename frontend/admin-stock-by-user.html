<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock by User - Medicine Expiry Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h1>💊 Medicine Expiry Tracker</h1>
        <div class="nav-links">
            <button id="backBtn" class="back-btn">← Back</button>
            <div class="nav-user">
                <span class="nav-username">👤 <strong id="navUsername">...</strong></span>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Stock by User</h2>
        </div>
        <p style="color:#64748b; font-size:14px; margin-bottom:20px;">
            Overview of every pharmacist's inventory. Click a row to view their full medicine list.
        </p>

        <div id="banner" class="banner banner-error"></div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Pharmacist ID</th>
                        <th>Name</th>
                        <th>City</th>
                        <th>Total Medicines</th>
                        <th>Total Qty</th>
                        <th>Safe</th>
                        <th>Expiring Soon</th>
                        <th>Urgent</th>
                        <th>Expired</th>
                    </tr>
                </thead>
                <tbody id="userStockTableBody">
                    <tr><td colspan="9" class="empty-state">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script src="admin-stock-by-user.js"></script>
</body>
</html>
