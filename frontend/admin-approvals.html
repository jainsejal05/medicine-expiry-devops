<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pending Approvals - Medicine Expiry Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h1>💊 Medicine Expiry Tracker</h1>
        <div class="nav-links">
            <button id="backBtn" class="back-btn">← Back</button>
            <div class="nav-user">
                <span class="nav-username">👤 <strong id="navUsername">...</strong></span>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Registration Requests</h2>
        </div>
        <p style="color:#64748b; font-size:14px; margin-bottom:20px;">
            New pharmacists who register need your approval before they can log in. Approving assigns them a unique Pharmacist ID.
        </p>

        <div id="banner" class="banner banner-error"></div>

        <div id="pendingWrap"></div>
    </div>

    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script src="admin-approvals.js"></script>
</body>
</html>
